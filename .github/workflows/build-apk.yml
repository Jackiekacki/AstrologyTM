name: Build - NEW Gold Tree Astro Free APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o gold_tree_astro_phone_upload.zip -d /tmp/upload
          unzip -o /tmp/upload/gold_tree_astro_source.zip -d .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldTreeAstro-Free-APK
          path: app/build/outputs/apk/debug/app-debug.apk
