name: Build AstrologyTM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/goldtreeastro/clone
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GoldTreeAstro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.goldtreeastro.clone'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.goldtreeastro.clone'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D9A441</item>
                  <item name="android:statusBarColor">#65130D</item>
                  <item name="android:navigationBarColor">#2E211B</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Gold Tree Astro"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/goldtreeastro/clone/MainActivity.java <<'EOF'
          package com.goldtreeastro.clone;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          public class MainActivity extends Activity {

              int MAROON = Color.rgb(123,22,14);
              int GOLD = Color.rgb(217,164,65);
              int CREAM = Color.rgb(255,248,232);
              int DARK = Color.rgb(46,33,27);
              int MUTED = Color.rgb(117,104,94);

              LinearLayout body;

              TextView text(String s,float size,int color,boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  v.setPadding(14,8,14,8);

                  if (bold)
                      v.setTypeface(Typeface.DEFAULT,Typeface.BOLD);

                  return v;
              }

              GradientDrawable box(int color) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(20);
                  return g;
              }

              void createBase(String title) {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(CREAM);

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setBackgroundColor(MAROON);

                  TextView logo = text("🌳",30,GOLD,true);
                  logo.setGravity(Gravity.CENTER);

                  header.addView(
                      logo,
                      new LinearLayout.LayoutParams(55,64)
                  );

                  TextView name = text(
                      title,
                      19,
                      Color.WHITE,
                      true
                  );

                  name.setGravity(Gravity.CENTER);

                  header.addView(
                      name,
                      new LinearLayout.LayoutParams(0,64,1)
                  );

                  TextView profile = text(
                      "●",
                      22,
                      GOLD,
                      true
                  );

                  profile.setGravity(Gravity.CENTER);

                  header.addView(
                      profile,
                      new LinearLayout.LayoutParams(55,64)
                  );

                  root.addView(header);

                  ScrollView scroll = new ScrollView(this);

                  body = new LinearLayout(this);
                  body.setOrientation(LinearLayout.VERTICAL);
                  body.setPadding(16,16,16,20);

                  scroll.addView(body);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,0,1
                      )
                  );

                  LinearLayout nav = new LinearLayout(this);
                  nav.setBackgroundColor(Color.WHITE);

                  String[] items = {
                      "Home",
                      "Chart",
                      "Dasha",
                      "Numbers",
                      "Panchang",
                      "Vastu",
                      "Predictions",
                      "Profile"
                  };

                  for (String item : items) {

                      TextView n = text(
                          item,
                          10,
                          item.equals(title)
                              ? Color.WHITE
                              : MUTED,
                          true
                      );

                      n.setGravity(Gravity.CENTER);

                      if (item.equals(title))
                          n.setBackground(box(MAROON));

                      n.setOnClickListener(
                          v -> navigate(item)
                      );

                      nav.addView(
                          n,
                          new LinearLayout.LayoutParams(
                              0,54,1
                          )
                      );
                  }

                  root.addView(nav);

                  setContentView(root);
              }

              void card(
                  String title,
                  String description,
                  View.OnClickListener click
              ) {

                  LinearLayout c =
                      new LinearLayout(this);

                  c.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  c.setPadding(10,6,10,6);
                  c.setBackground(box(Color.WHITE));

                  c.addView(
                      text(
                          title,
                          17,
                          MAROON,
                          true
                      )
                  );

                  c.addView(
                      text(
                          description,
                          14,
                          MUTED,
                          false
                      )
                  );

                  if (click != null)
                      c.setOnClickListener(click);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,-2
                      );

                  p.setMargins(0,0,0,12);

                  body.addView(c,p);
              }

              void home() {

                  createBase("Home");

                  TextView logo =
                      text(
                          "🌳",
                          70,
                          GOLD,
                          true
                      );

                  logo.setGravity(Gravity.CENTER);

                  body.addView(
                      logo,
                      new LinearLayout.LayoutParams(
                          -1,100
                      )
                  );

                  TextView title =
                      text(
                          "GOLD TM ASTRO",
                          26,
                          MAROON,
                          true
                      );

                  title.setGravity(Gravity.CENTER);

                  body.addView(title);

                  TextView subtitle =
                      text(
                          "Vedic astrology & personalized guidance",
                          14,
                          MUTED,
                          false
                      );

                  subtitle.setGravity(Gravity.CENTER);

                  body.addView(subtitle);

                  body.addView(
                      text(
                          "Astrology Services",
                          20,
                          DARK,
                          true
                      )
                  );

                  card(
                      "Birth Chart",
                      "Lagna, planets and house analysis",
                      v -> report("Chart")
                  );

                  card(
                      "Vimshottari Dasha",
                      "Mahadasha and Antardasha periods",
                      v -> report("Dasha")
                  );

                  card(
                      "Numerology",
                      "Life path, destiny and compatibility",
                      v -> report("Numbers")
                  );

                  card(
                      "Panchangam",
                      "Tithi, nakshatra and auspicious timings",
                      v -> report("Panchang")
                  );

                  card(
                      "Vastu",
                      "Directions and vastu guidance",
                      v -> report("Vastu")
                  );

                  card(
                      "Predictions",
                      "Career, marriage, finance and yearly results",
                      v -> report("Predictions")
                  );

                  card(
                      "Birth Profile",
                      "Enter name, date, time and place of birth",
                      v -> profile()
                  );
              }

              void report(String title) {

                  createBase(title);

                  body.addView(
                      text(
                          title,
                          25,
                          MAROON,
                          true
                      )
                  );

                  card(
                      "Overview",
                      "Personalized astrology analysis.",
                      null
                  );

                  card(
                      "Detailed Analysis",
                      "Detailed calculations and interpretations can be connected to an authorized astrology service.",
                      null
                  );

                  card(
                      "Charts & Reports",
                      "Rasi, divisional charts, planetary periods and reports.",
                      null
                  );
              }

              void profile() {

                  createBase("Profile");

                  body.addView(
                      text(
                          "Birth Profile",
                          25,
                          MAROON,
                          true
                      )
                  );

                  String[] fields = {
                      "Name",
                      "Date of Birth",
                      "Time of Birth",
                      "Place of Birth"
                  };

                  for (String field : fields) {

                      body.addView(
                          text(
                              field,
                              14,
                              DARK,
                              true
                          )
                      );

                      EditText input =
                          new EditText(this);

                      input.setHint(field);
                      input.setSingleLine(true);

                      body.addView(
                          input,
                          new LinearLayout.LayoutParams(
                              -1,55
                          )
                      );
                  }

                  Button save =
                      new Button(this);

                  save.setText("SAVE PROFILE");

                  body.addView(save);
              }

              void navigate(String page) {

                  if (page.equals("Home"))
                      home();

                  else if (page.equals("Profile"))
                      profile();

                  else
                      report(page);
              }

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  home();
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstrologyTM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
